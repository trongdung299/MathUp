spring:
  application:
    name: mathup
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:mathup}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:mathup}
    password: ${DB_PASSWORD:mathup}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # DBs created before Flyway was introduced already contain the V1 schema
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:mathup-dev-only-jwt-signing-secret-change-in-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
